name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands, so we don't
# queue redundant builds on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Clear the .next cache before building. Next.js occasionally serves
        # stale generated type files (e.g. routes.d.ts, segment-config) from a
        # prior version after a dependency upgrade, which breaks type checking.
        # A clean build avoids that trap.
        run: |
          rm -rf .next
          npm run build
