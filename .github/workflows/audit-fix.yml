name: Audit Fix

# Operator-triggered security fix pass: runs `npm audit fix` on both the root
# and netlify lockfiles, commits the result to a dedicated branch, and opens
# (or updates) a single PR. Only compatible-range fixes are applied — breaking
# major bumps are left to Dependabot's per-advisory PRs. The root build/test
# must pass before the PR is opened, so a broken fix never lands for review.
#
# Dependabot owns scheduled security-update PRs. Use workflow_dispatch here for
# an on-demand repair pass without creating a second automated PR stream.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            netlify/package-lock.json

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create or refresh fix branch
        run: |
          BRANCH=bot/audit-fix
          # Reset the branch to the latest default branch tip so each run
          # produces a fresh diff instead of stacking on a stale base.
          git checkout -B "$BRANCH"

      - name: Apply compatible fixes (root)
        run: |
          npm ci
          # --force is intentionally omitted: we only want non-breaking fixes
          # here. Anything requiring a major bump stays for Dependabot.
          npm audit fix || true
          # The override chain may need an install to settle the lockfile.
          npm install

      - name: Apply compatible fixes (netlify)
        run: |
          npm --prefix ./netlify ci
          npm --prefix ./netlify audit fix || true
          npm --prefix ./netlify install

      - name: Verify root build
        id: verify
        run: |
          rm -rf .next
          npm run lint
          npm test
          npm run build

      - name: Commit changes
        id: commit
        run: |
          # Stage both lockfiles and any manifest edits (overrides, version bumps).
          git add package.json package-lock.json netlify/package.json netlify/package-lock.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No fixable vulnerabilities this run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore(deps): automated audit fix

            Generated by the Audit Fix workflow. Non-breaking security fixes
            applied via \`npm audit fix\` on the root and netlify lockfiles.
            Breaking major-version bumps are intentionally excluded — those
            arrive as separate Dependabot PRs."
          fi

      - name: Push branch and open PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin bot/audit-fix
          # One rolling PR per branch. gh pr create fails if a PR is already
          # open for the head branch; in that case locate it and update it.
          if ! gh pr create \
              --base main \
              --head bot/audit-fix \
              --title 'chore(deps): automated security audit fix' \
              --body 'Automated weekly pass of `npm audit fix` on the root and netlify lockfiles.

          - Only compatible (non-breaking) fixes are applied.
          - Root lint, test, and build all pass in CI before this PR opens.
          - Breaking major bumps are left to Dependabot'\''s per-advisory PRs.

          Review the diff, then merge. If the run found nothing fixable, this PR is not created.

          🤖 Generated by the Audit Fix workflow.' \
              --label 'dependencies'; then
            PR_NUMBER=$(gh pr list --head bot/audit-fix --state open --json number --jq '.[0].number')
            if [ -n "$PR_NUMBER" ]; then
              gh pr edit "$PR_NUMBER" \
                --title 'chore(deps): automated security audit fix' \
                --body 'Automated weekly pass of `npm audit fix` on the root and netlify lockfiles.

          - Only compatible (non-breaking) fixes are applied.
          - Root lint, test, and build all pass in CI before this PR opens.
          - Breaking major bumps are left to Dependabot'\''s per-advisory PRs.

          🤖 Generated by the Audit Fix workflow.'
            else
              echo "PR creation failed and no open PR found for bot/audit-fix — investigate."
              exit 1
            fi
          fi
